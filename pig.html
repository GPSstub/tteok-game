<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#18171b"><title>돼지 떡치기</title><meta name="description" content="제시된 돼지 색깔을 순서대로 눌러 송편을 완성하세요. 혼자 즐기는 떡치기 연습 게임."><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314837c'/%3E%3Cpath d='M11 16V5M21 16V5' stroke='%23dbfff3' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='21' r='9' fill='%23dbfff3'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body data-character="pig">
<main class="game"><header class="stage"><div class="topline"><span class="solo">돼지 · 혼자 연습 <a class="character-link" href="index.html">토끼로 전환</a></span><button id="sound" class="small" aria-label="소리 켜기" aria-pressed="false">소리 OFF</button></div><div id="lives" class="lives" role="img" aria-label="절구 6개 남음"></div><div class="round-label">ROUND <b id="round">1</b></div><div class="score"><span>송편</span><b id="score">0</b></div><div class="actor"><img id="rabbit" src="assets/pig.webp" alt="떡을 만드는 돼지 캐릭터"><span class="mortar">떡방아</span></div></header>
<div class="timer"><span class="clock">◷</span><div class="track"><div id="timebar"></div></div><span id="time">10.0</span></div>
<section class="field" aria-label="입력 패턴"><div class="field-head"><div class="combo-label">COMBO<strong id="combo">0</strong></div><div class="recipe"><img src="assets/leaf.webp" alt=""><span id="recipe">쑥송편</span></div><button id="pause" class="small" disabled>일시정지</button></div><div class="pattern-wrap"><div id="pattern" class="pattern"></div></div><div id="feedback" class="feedback" role="status">위의 순서대로 눌러주세요</div>
<div id="overlay" class="overlay"><div class="dialog"><span class="eyebrow">혼자 하는 돼지 떡치기</span><h1 id="dialog-title">돼지 떡치기</h1><p id="dialog-body">위에 나온 색을 순서대로 눌러<br>송편을 완성하세요.</p><p class="rules" id="rules">패턴마다 10초 · 절구 6개<br>시간 초과 시 절구 1개 차감<br>보라는 항상 다른 색과 한 세트예요<br>패턴은 최대 8줄까지 늘어나요</p><button id="start" class="primary">시작하기</button></div></div></section>
<footer class="controls pig-controls" aria-label="돼지 입력 버튼"><button class="slot input red" data-color="1" aria-label="빨강 돼지 입력"><img src="assets/red.webp" alt="빨강 돼지"><span>2</span></button><div class="slot empty" aria-hidden="true"></div><div class="slot empty" aria-hidden="true"></div><button class="slot input yellow" data-color="0" aria-label="노랑 돼지 입력"><img src="assets/yellow.webp" alt="노랑 돼지"><span>1</span></button><button class="slot input orange" data-color="2" aria-label="주황 돼지 입력"><img src="assets/orange.webp" alt="주황 돼지"><span>3</span></button><button class="slot input purple" data-color="3" aria-label="보라 돼지 입력"><img src="assets/purple.webp" alt="보라 돼지"><span>4</span></button></footer><div class="footnote">PC에서는 1 · 2 · 3 · 4 키로 입력</div></main><script src="game.js"></script></body></html>
